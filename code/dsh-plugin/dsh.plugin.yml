# dsh.plugin.yml —— 插件自描述（schema:1）；profile 装配的元数据来源（dshctl plugin install 消费）
# layout: in-place=源码原地（patch 指工作区路径，改源码即生效）| vendored=装配拷贝进 DSH_HOME/plugins/<id>/
schema: 1
id: bkn-plugin
entry: index.ts
layout: in-place
description: BKN 知识网语义检索 + 风险护栏。让 Agent 按 i2Stream 运维语义查询产品配置/实体关系/操作规程/故障场景，诊断报错与链路故障、产出解决方案；RiskGuard 在工具执行前拦截高危动作（BKN 三源规则或白名单模式）。
config:
  bknRoot: /hdd/demo/public/i2stream-bkn/bkn
  guardEnabled: true
  guardBlock: true
provides:
  - query_product
  - resolve_relation
  - resolve_operation
  - list_scenarios
  - get_prerequisites
  - check_action_risk
  - check_compatibility
  - diagnose_error
  - diagnose_db_link
  - design_solution
  - explain_architecture
  - search_qdrant
external:
  - key: qdrant
    desc: 外部向量库 Qdrant（search_qdrant / diagnose_db_link 的 dense 检索）
    config: qdrantUrl
    env: I2STREAM_QDRANT_URL
  - key: embed-sidecar
    desc: BGE embedding sidecar（查询向量化，与 Hermes 同模型）
    config: embedUrl
    env: I2STREAM_EMBED_URL
  - key: bkn-data
    desc: 共享 BKN 数据目录（全部查询工具的事实来源，契约校验对象）
    config: bknRoot
    env: I2STREAM_BKN_ROOT
  - key: skill-manifest
    desc: Skill 清单（resolve_* 返回的 Skill 指针）
    config: skillManifestPath
    env: I2STREAM_SKILL_MANIFEST
  - key: gap-log
    desc: 质量闭环 gap 日志（可写目录，512KB 轮转）
    config: gapLogPath
    env: I2STREAM_GAP_LOG
category: 知识网
