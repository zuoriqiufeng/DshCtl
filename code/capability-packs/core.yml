# capability-packs/core.yml
# subagent/workflow/goal/plan/web/桌面联动等编码 agent 能力 + 实例覆写（如 connection headless）
pack: core
description: "subagent/workflow/goal/plan/web/桌面联动等编码 agent 能力 + 实例覆写（所有领域恒隐含必裁）"
disable:
  tools:
    - ui-sidebar-terminal
    - ui-sidebar-files
    - ui-sidebar-documentpreview
    - ui-deliverables
    - ui-subagent
    - ui-workflow-run
    - ui-goal
    - ui-plan
    - ui-schedule
    - ui-jobs
    - ui-message-feedback
    - ui-trajectory
    - open-in-app
    - ui-open-in-app
    - session-log-download
    - directory-picker
    - ui-reference
    - file-reference-local
    - workspace-files
    - message-feedback
    - terminal-controller
    - subagent-spawn-in-process
    - subagent-fork-in-process
    - subagent
    - tool-subagent-control
    - tool-subagent-list-agents
    - tool-subagent
    - tool-subagent-fork
    - workflow-ptc
    - tool-workflow
    - goal
    - goal-round-driver
    - command-goal
    - tool-goal
    - plan-mode
    - web
    - web-search-deepseek
    - web-fetch-http
    - tool-web
    - session-log-deepseek
    - webserver
    - web-runtime
    - client-hmr
    # 2026-10-21 R3：实例侧确认无消费者的行，统一禁用（瘦身边距；后续需要再放开）。
    # 回退教训×2：remote-access 是 remoteAccess 服务源（禁用→gateway/session 等 6 组件 pending）；
    # working-directory/tool-working-directory 是 tool-skill 的 workingDirectory 服务源（禁用→对话 500）。两者均已回退——
    # 「id 像 UI 行」不等于「无服务消费者」，裁剪前必须 grep inject/静态依赖。
    - web-deepseek-api
    - harness-dev-context
    - ui-secret-mask
    - ui-deepseek-model-label-1017
  overrides:
    - id: connection
      inject: []
      config:
        trustedHosts: []
