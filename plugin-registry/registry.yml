# plugin-registry/registry.yml —— 插件库目录（schema:1）；登记引用为主，导入件落 sources/
schema: 1
plugins:
  - id: bkn-plugin
    name: i2stream-bkn-plugin
    description: BKN 知识网语义检索 + 风险护栏。让 Agent 按 i2Stream 运维语义查询产品配置/实体关系/操作规程/故障场景，诊断报错与链路故障、产出解决方案；RiskGuard 在工具执行前拦截高危动作（BKN 三源规则或白名单模式）。
    provides:
      - query_product
      - resolve_relation
      - resolve_operation
      - list_scenarios
      - get_prerequisites
      - check_action_risk
      - check_compatibility
      - diagnose_error
      - diagnose_db_link
      - design_solution
      - explain_architecture
      - search_qdrant
    tier: extension
    category: 知识网
    source: local
    external:
    - key: qdrant
      desc: 外部向量库 Qdrant（search_qdrant / diagnose_db_link 的 dense 检索）
      config: qdrantUrl
      env: I2STREAM_QDRANT_URL
    - key: embed-sidecar
      desc: BGE embedding sidecar（查询向量化）
      config: embedUrl
      env: I2STREAM_EMBED_URL
    - key: bkn-data
      desc: 共享 BKN 数据目录（全部查询工具的事实来源）
      config: bknRoot
      env: I2STREAM_BKN_ROOT
    - key: skill-manifest
      desc: Skill 清单（Skill 指针解析）
      config: skillManifestPath
      env: I2STREAM_SKILL_MANIFEST
    - key: gap-log
      desc: 质量闭环 gap 日志（可写目录）
      config: gapLogPath
      env: I2STREAM_GAP_LOG
    path: /hdd/demo/public/dsh-info/code/dsh-plugin/index.ts
    trusted: true
    added_at: 2026-09-17
  - id: ops-api
    name: i2stream-ops-api
    description: 领域对外 API 面。HTTP↔DSH 会话桥（follow/prompt 帧协议，把外部调用变成一轮 Agent 会话并回传流式/非流式结果）、Bearer 密钥鉴权、/admin 管理面（MCP/技能开关、依赖健康）、记忆网关接入与任务超时管控。
    provides:
      - HTTP API（Bearer 鉴权）
      - /admin 管理面
      - 会话桥（follow/prompt 帧协议）
      - 记忆网关接入
      - 依赖健康上报
      - 任务超时/熔断管控
    tier: extension
    category: 对外 API
    source: local
    external:
    - key: memory-gateway
      desc: MemoryCore 记忆网关（recall / search / capture）
      config: memory.gatewayUrl
    - key: agent-preset
      desc: 会话挂载的 agent preset
      config: preset
    - key: skills-dir
      desc: /admin 技能启停的技能根目录
      config: admin.skillsDir
    - key: patch-path
      desc: /admin 托管段读写的 profile patch 文件
      config: admin.patchPath
    path: /hdd/demo/public/dsh-info/code/ops-api/index.ts
    trusted: true
    added_at: 2026-09-17
  - id: ops-skill-manager
    name: i2stream-ops-skill-manager
    description: 技能自管理。暴露 skill_manage 工具让 Agent 自己安装/启停/更新技能包（SKILL.md 目录）并记 usage 台账——技能生命周期不再需要人工进文件系统操作。
    provides:
      - skill_manage（安装/启用/禁用/更新技能）
      - usage 台账
      - curator 迁移
    tier: extension
    category: 技能管理
    source: local
    external:
    - key: skills-dir
      desc: 被管理技能根目录（写目标）
      config: skillsDir
    - key: upstream-dir
      desc: 共享技能源（sync 只读拉取源）
      config: upstreamDir
    path: /hdd/demo/public/dsh-info/code/ops-skill-manager/index.ts
    trusted: true
    added_at: 2026-09-17
