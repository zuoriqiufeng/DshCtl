# domains/ops/domain.yml —— 由 dshctl adopt 产出（schema:1）；密钥只记 env 名
schema: 1
domain: ops
display_name: DSH ops domain agent
dsh_home: /hdd/demo/public/dsh-info/.dsh-home
dsh_source: /hdd/demo/public/dsh-info/deepseek-harness
capabilities:
  - remote-exec
guard:
  rule_source: bkn
preset:
  id: i2stream-ops
  source: /hdd/demo/public/dsh-info/code/presets/i2stream-ops
  skills_dirs:
    - /hdd/demo/public/dsh-info/.dsh-home/skills
plugins:
  - id: bkn-plugin
    path: /hdd/demo/public/dsh-info/code/dsh-plugin/index.ts
    config:
      bknRoot: /hdd/demo/public/i2stream-bkn/bkn
      qdrantUrl: http://127.0.0.1:6333
      embedUrl: http://127.0.0.1:8096/embed
      qdrantCollection: i2stream_collection
      gapLogPath: /hdd/demo/public/i2stream-bkn/logs/gap_log.jsonl
  - id: ops-skill-manager
    path: /hdd/demo/public/dsh-info/code/ops-skill-manager/index.ts
    config:
      skillsDir: /hdd/demo/public/dsh-info/.dsh-home/skills
      upstreamDir: /hdd/demo/public/i2stream-bkn/skill
      intervalHours: 168
      staleAfterDays: 30
      archiveAfterDays: 90
      firstRunDelaySec: 120
  - id: intent-router
    path: /hdd/demo/public/dsh-info/code/intent-router/index.ts
    config:
      # inject：把高置信意图注入本步提示（v1 唯一的行为改动）。
      # 观测数据见 .dsh-home/logs/intent-router/intent-router_<日期>.log；若误识别率上升，退回 observe。
      mode: inject
      taxonomyPath: /hdd/demo/public/dsh-info/code/intent-router/taxonomy.generated.json
      # useVector 默认 false：实测无可用工作点（详见插件 README「向量路径为何默认关闭」）
      useVector: false
      # 文件日志：<logDir>/<logStem>_YYYY-MM-DD.log，按大小（.1/.2/.3）与日期双维轮转。
      # 可调：logDir / logStem / logLevel(off|error|warn|info|debug) / logMaxBytes /
      #       logBackups / logRetentionDays(0=永久) / logTextMaxChars(0=不截断)
      logLevel: info
api_server:
  port: 8643
  api_key_env: OPS_API_KEY
  turn_timeout_sec: 120
  max_task_duration_sec: 120
  plugin_path: /hdd/demo/public/dsh-info/code/ops-api/index.ts
  plugin_id: ops-api
# 模型配置（2026-10-21 修订）：default 不钉死——未配置即走 DSH 会话默认模型。
# 历史：v0.4.1 曾钉死 mimo-x-flash-preview（根治 apply 冲掉 settings 节 → MISSING_CREDENTIAL），
# 但该网关 2026-10-21 起通道整体失效（/v1/models 空、两模型 503 model_not_found）。
# providers 仅作声明备忘（huoshan/deepseek-v4-flash 已实测可用，需要时在此配 default 即可切回）；
# 密钥只记 env 名（apiKeyEnv），env 值经 $DSH_HOME/.credentials.yaml refs 解析（不落明文）。
model:
  providers:
    huoshan:
      displayName: 方舟
      apiKeyEnv: HUOSHAN_API_KEY
      api: openai-completions
      baseURL: https://ark.cn-beijing.volces.com/api/coding/v3
      models:
        - id: deepseek-v4-flash
          name: v4flash
    mimo-x:
      displayName: mimo-x
      apiKeyEnv: MIMO_X_API_KEY
      api: openai-completions
      baseURL: http://192.168.34.65:60080/v1
      models:
        - id: mimo-x-flash-preview
          name: mimo-x-flash-preview
        - id: mimo-x-pro-preview
          name: mimo-x-pro-preview
memory:
  gateway_url: http://127.0.0.1:8420
  session_keys: []
ports:
  api: 8643
  gui: null
systemd_unit: dsh-ops-trial.service
shared_deps:
  - name: i2agent
    url: http://127.0.0.1:8090
  - name: memory-gateway
    url: http://127.0.0.1:8420
